# ==============================================================================
# Production Redis Configuration for Postal Nexus Streams & Rate Limiting
# ==============================================================================

# Network & Ports
bind 0.0.0.0
port 6379
tcp-backlog 2048
timeout 0
tcp-keepalive 300

# Concurrency & Client Management
maxclients 10000

# Persistence & Durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10
save 60 10000

# Memory Management (Streams must never be evicted silently)
maxmemory 2gb
maxmemory-policy noeviction

# Stream Configuration (Radix Tree packing optimization)
stream-node-max-bytes 4096
stream-node-max-entries 100

# Latency & Slowlog Monitoring
slowlog-log-slower-than 10000
slowlog-max-len 1024
latency-monitor-threshold 20
