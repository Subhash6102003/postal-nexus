apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailer-api
  labels:
    app: mailer-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mailer-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mailer-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: mailer-service-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: REDIS_HOST
              value: "redis-service"
            - name: PGHOST
              value: "postgres-service"
            - name: PGDATABASE
              value: "mailer_db"
            - name: PGUSER
              value: "postgres"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mailer-secrets
                  key: pg-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mailer-secrets
                  key: jwt-secret
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: mailer-secrets
                  key: webhook-secret
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mailer-api-service
spec:
  type: ClusterIP
  selector:
    app: mailer-api
  ports:
    - port: 80
      targetPort: 3000
